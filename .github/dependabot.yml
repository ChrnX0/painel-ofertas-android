version: 2
updates:
  # Dependências do Gradle (AndroidX, Compose, Kotlin…)
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels: ["dependências"]

  # Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels: ["dependências"]
