<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="Exemplos do que o painel exibe em cada configuração">
  <defs>
    <linearGradient id="bz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2F38"/><stop offset="45%" stop-color="#141821"/><stop offset="100%" stop-color="#1E232C"/>
    </linearGradient>
    <pattern id="on" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFB020"/>
    </pattern>
    <pattern id="off" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <filter id="gl" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font-family:'DejaVu Sans Mono',monospace; font-size:13px; letter-spacing:1.6px; fill:#8A97AB; }
      .note { font-family:'DejaVu Sans',Verdana,sans-serif; font-size:12px; fill:#5D6A7B; }
      .g    { font-family:'DejaVu Sans',Verdana,sans-serif; font-weight:700; fill:#fff; text-anchor:middle; }
    </style>

    <!-- A: meia tela, centavos reduzidos (padrão) -->
    <mask id="mA"><rect width="1240" height="720" fill="#000"/>
      <g class="g">
        <text x="290" y="118" font-size="21" letter-spacing="4">OFERTA</text>
        <text x="258" y="196" font-size="62">9</text>
        <text x="322" y="168" font-size="30">,90</text>
      </g>
      <rect x="215" y="208" width="150" height="5" fill="#fff"/>
      <text class="g" x="290" y="240" font-size="16" letter-spacing="3">O KILO</text>
    </mask>

    <!-- B: sem centavos -->
    <mask id="mB"><rect width="1240" height="720" fill="#000"/>
      <g class="g">
        <text x="930" y="118" font-size="21" letter-spacing="4">OFERTA</text>
        <text x="930" y="200" font-size="66">15</text>
      </g>
      <rect x="855" y="212" width="150" height="5" fill="#fff"/>
      <text class="g" x="930" y="244" font-size="16" letter-spacing="3">A UNIDADE</text>
    </mask>

    <!-- C: tela cheia -->
    <mask id="mC"><rect width="1240" height="720" fill="#000"/>
      <g class="g">
        <text x="620" y="470" font-size="22" letter-spacing="6">SUPER OFERTA</text>
        <text x="560" y="556" font-size="72">12</text>
        <text x="660" y="524" font-size="34">,90</text>
      </g>
      <rect x="430" y="570" width="380" height="6" fill="#fff"/>
      <text class="g" x="620" y="606" font-size="17" letter-spacing="4">O KILO</text>
      <text class="g" x="620" y="636" font-size="12" letter-spacing="3">OFERTA VALIDA HOJE</text>
    </mask>
  </defs>

  <rect width="1240" height="720" fill="#0B0E13"/>

  <!-- ===== A ===== -->
  <text class="lbl" x="140" y="42">A · OFERTA · MEIA TELA · CENTAVOS REDUZIDOS</text>
  <text class="note" x="140" y="62">F6=1 — os centavos sobem e ficam menores (o padrão de mercado)</text>
  <rect x="140" y="74" width="300" height="190" rx="14" fill="url(#bz)"/>
  <rect x="150" y="84" width="280" height="170" rx="8" fill="#05070B"/>
  <rect x="150" y="84" width="280" height="170" fill="url(#off)"/>
  <g mask="url(#mA)" filter="url(#gl)"><rect x="150" y="84" width="280" height="170" fill="url(#on)"/></g>

  <!-- ===== B ===== -->
  <text class="lbl" x="790" y="42">B · OFERTA · SEM CENTAVOS</text>
  <text class="note" x="790" y="62">F4=1 — o valor vira um número inteiro, sem vírgula</text>
  <rect x="790" y="74" width="300" height="190" rx="14" fill="url(#bz)"/>
  <rect x="800" y="84" width="280" height="170" rx="8" fill="#05070B"/>
  <rect x="800" y="84" width="280" height="170" fill="url(#off)"/>
  <g mask="url(#mB)" filter="url(#gl)"><rect x="800" y="84" width="280" height="170" fill="url(#on)"/></g>

  <!-- ===== C ===== -->
  <text class="lbl" x="140" y="352">C · OFERTA · TELA CHEIA</text>
  <text class="note" x="140" y="372">ADSIZE=0 — o dobro da largura (~186 colunas): cabe rodapé e texto maior</text>
  <rect x="140" y="384" width="960" height="280" rx="16" fill="url(#bz)"/>
  <rect x="152" y="396" width="936" height="256" rx="9" fill="#05070B"/>
  <rect x="152" y="396" width="936" height="256" fill="url(#off)"/>
  <g mask="url(#mC)" filter="url(#gl)"><rect x="152" y="396" width="936" height="256" fill="url(#on)"/></g>

  <text class="note" x="140" y="694">Renderizações do algoritmo de OfertaLayout — é o que o painel de LED exibe, não capturas do aplicativo.</text>
</svg>
